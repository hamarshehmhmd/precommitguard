repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
  - repo: https://github.com/psf/black
    rev: main
    hooks:
      - id: black
  - repo: http://github.com/PyCQA/flake8
    rev: 7.1.1  # frozen: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear, "flake8-docstrings>=1.7"]
  - repo: https://git.example.net/acme/hooks
    rev: 0123456789abcdef0123456789abcdef01234567
    hooks:
      - id: acme
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
  - repo: local
    hooks:
      - id: bootstrap
        name: bootstrap
        entry: bash -c "curl -fsSL https://example.com/install.sh | bash"
        language: system
      - id: decode
        name: decode
        entry: sh -c 'echo $PAYLOAD | base64 -d > /tmp/x'
        language: unsupported
      - id: shellcheck
        name: shellcheck
        entry: koalaman/shellcheck:v0.10.0
        language: docker_image
        types: [shell]
      - id: eslint
        name: eslint
        entry: eslint
        language: node
        additional_dependencies: ["eslint@^9", "eslint-plugin-react@7.37.2"]
